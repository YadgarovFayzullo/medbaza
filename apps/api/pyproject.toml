[project]
name = "medbaza-api"
version = "0.1.0"
description = "MedBaza — multi-vendor medical supplies marketplace API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "cryptography>=43.0",
    "arq>=0.26",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pytest-cov>=5.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true

# Strict on the layers that carry the invariants (CLAUDE.md section 2).
[[tool.mypy.overrides]]
module = ["app.services.*", "app.models.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run so the session-scoped engine fixture and the
# per-test sessions live on the same loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
